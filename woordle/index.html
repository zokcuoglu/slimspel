<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woordle · Slimspel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../css/site.css">
<style>
/* Page-specific styles for woordle */
.label{font-family:var(--f-display);font-weight:600;margin-top:22px;margin-bottom:8px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice .chip{font-size:16px;padding:7px 14px}
.today{margin-top:14px;font-family:var(--f-display);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:10px}
.legend b{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* The rows of guesses */
.rows{display:grid;gap:6px;justify-content:center;margin:0 auto}
.rw{display:grid;grid-template-columns:repeat(var(--n),min(14vw,56px));gap:6px}
.lt{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:var(--card);
    font-family:var(--f-display);font-weight:700;font-size:clamp(22px,7vw,32px);text-transform:uppercase}
.lt.filled{border-color:var(--muted)}
body{--good-c:#3fa564;--near-c:#e0b030;--miss-c:#8a94a8}
.lt.good,.key.good{background:var(--good-c);border-color:var(--good-c);color:#fff}
.lt.near,.key.near{background:var(--near-c);border-color:var(--near-c);color:#fff}
.lt.miss,.key.miss{background:var(--miss-c);border-color:var(--miss-c);color:#fff}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.lt.flip{animation:flip .35s ease}
@media (prefers-reduced-motion: reduce){.lt.flip{animation:none}}
.msg{text-align:center;min-height:1.6em;margin:10px 0;font-family:var(--f-display);font-weight:600;color:var(--bad)}

/* On-screen keyboard */
.kb{display:grid;gap:6px;max-width:560px;margin:6px auto 0}
.kb .r{display:flex;gap:4px;justify-content:center}
.key{flex:1;max-width:42px;height:52px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:600;font-size:18px;text-transform:uppercase;padding:0}
.key.wide{max-width:74px;font-size:13px}
.key:hover{border-color:var(--ink)}

/* Statistics and rankings */
.panel h3{font-size:19px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div b{display:block;font-family:var(--f-display);font-size:28px}
.stats div span{font-size:13px;color:var(--muted)}
.dist{display:grid;gap:4px;margin-top:12px}
.dist .d{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.dist i{display:block;background:var(--miss-c);color:#fff;font-style:normal;font-weight:700;text-align:right;padding:2px 8px;border-radius:4px;min-width:26px}
.dist i.now{background:var(--good-c)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs .chip{font-size:14px;padding:4px 12px}
.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rank td,.rank th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.rank th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rank td.n{text-align:right}.rank th.n{text-align:right}
.rank tr.me td{background:color-mix(in srgb,var(--accent) 25%,var(--card));font-weight:700}
.small{color:var(--muted);font-size:13px;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}

.big{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,9vw,54px);line-height:1.1}
.record{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;border-radius:99px;padding:3px 12px;margin-top:8px}
.word-info{margin-top:14px;background:var(--paper);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.word-info .w{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase}
.word-info .row2{display:flex;gap:6px;flex-wrap:wrap}
.word-info .tag2{border:1.5px solid var(--line);border-radius:99px;padding:1px 10px;font-size:13px;background:var(--card)}
.word-info h4{margin:4px 0 0;font-family:var(--f-display);font-size:15px}
.word-info p{margin:0}
.word-info .ex{font-style:italic}
.credit{color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<!-- Covers the page until js/core.js has checked the login (see index.html of the site) -->
<div id="gate"><div class="gc"><p>Laden…</p></div></div>
<script>
setTimeout(() => {
  if (window.__slimReady) return;
  document.querySelector("#gate .gc").innerHTML =
    "<h2>Laden lukt niet</h2><p>Ververs de pagina. Gaat het nog steeds mis? Vraag het aan Zana.</p>";
}, 10000);
</script>
<main class="wrap">
  <div class="top">
    <a class="back" id="back" href="../">← Slimspel</a>
    <span id="user"></span>
  </div>

  <!-- Screen 1: level, own statistics, rankings -->
  <section id="setup">
    <h1><mark>Woord</mark>le <span id="flag"></span></h1>
    <p class="sub" id="intro"></p>
    <div class="legend" id="legend"></div>
    <p class="sub" style="margin-top:8px" id="daily"></p>
    <div class="label" id="lvlLabel"></div>
    <div class="choice" id="levels"></div>
    <p class="today" id="today" hidden></p>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="go"></button></div>
    <div class="grid2">
      <div class="panel" id="statsBox1"></div>
      <div class="panel" id="rankBox1"></div>
    </div>
  </section>

  <!-- Screen 2: the game -->
  <section id="play" hidden>
    <div class="bar">
      <span class="chip" id="what"></span>
      <span class="chip" id="clock">0:00</span>
      <button class="btn" id="stop"></button>
    </div>
    <div class="rows" id="rows"></div>
    <p class="msg" id="msg"></p>
    <div class="kb" id="kb"></div>
  </section>

  <!-- Screen 3: finished (guessed or not) -->
  <section id="done" hidden>
    <div class="panel">
      <div class="big" id="result"></div>
      <p class="sub" id="resultText"></p>
      <span class="record" id="record" hidden></span>
      <div class="word-info" id="wordInfo"></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="change"></button>
    </div>
    <div class="grid2">
      <div class="panel" id="statsBox2"></div>
      <div class="panel" id="rankBox2"></div>
    </div>
  </section>

  <p class="credit" id="credit"></p>
</main>

<script type="module">
import { gate, userBox, saveAttempt, loadAttempts, flash, loadLocal, saveLocal, today, esc, saveWoordlePlay, loadWoordlePlays } from "../js/core.js";

// ---------- Language ----------
// ?taal=tr = Turkish words and a Turkish screen (opened from nl-oefenbank); default = Dutch words, Dutch screen.
const LANG = new URLSearchParams(location.search).get("taal") === "tr" ? "tr" : "nl";
const MODULE = LANG === "tr" ? "slimspel-woordle-tr" : "slimspel-woordle";
const TRIES = 6;
const LEN = { makkelijk: 4, normaal: 5, moeilijk: 6 };
const T = {
  nl: { levels: { makkelijk: "Makkelijk · 4 letters", normaal: "Normaal · 5 letters", moeilijk: "Moeilijk · 6 letters" },
    intro: "Raad het geheime woord in 6 beurten. Typ een echt woord en druk op Enter. De kleuren helpen je:",
    legend: ["goede letter, goede plek", "letter zit erin, andere plek", "letter zit er niet in"],
    daily: "Elke dag is er per niveau één nieuw woord, voor iedereen hetzelfde.", level: "Niveau",
    start: "Start", cont: "Verder spelen", back: "← Terug", other: "Ander niveau van vandaag",
    typeN: n => `Typ ${n} letters.`, unknown: "Dit woord ken ik niet. Probeer een ander woord.",
    todayWon: g => `Vandaag geraden in ${g} ${g > 1 ? "pogingen" : "poging"}. Morgen is er een nieuw woord!`,
    todayLost: "Vandaag niet geraden. Morgen is er een nieuw woord!",
    win: g => g === 1 ? "In één keer!" : g <= 3 ? "Super goed!" : "Geraden!", lost: "Helaas…",
    resWon: (lv, g, t) => `${lv} · ${g} ${g > 1 ? "pogingen" : "poging"} · tijd ${t}`, resLost: lv => `${lv} · morgen een nieuwe kans!`,
    rec: p => p === null ? "Eerste keer geraden!" : `Nieuw record! (was ${p} pogingen)`, was: "Het woord was:",
    stats: "Jouw statistieken", played: "gespeeld", winPct: "% geraden", streak: "reeks", maxStreak: "langste reeks",
    dist: "In hoeveel pogingen geraden", noStats: "Nog niet gespeeld op dit niveau.",
    rank: "Ranglijst", tabs: { dag: "Vandaag", week: "Deze week", maand: "Deze maand" }, allLv: "Alle niveaus",
    cols: ["", "Naam", "Punten", "Dagen", "Gem."], colDay: ["", "Naam", "Pogingen", "Tijd"], notGuessed: "niet geraden",
    nobody: "Nog niemand in deze periode.", pts: "Punten: 1e poging 6, 2e poging 5 … 6e poging 1, niet geraden 0.",
    rankErr: "De ranglijst is nu niet beschikbaar.", saveErr: c => `Score niet opgeslagen (${c}).`, loadErr: "De woorden konden niet worden geladen. Ververs de pagina.",
    credit: "Woordenlijst voor het controleren van woorden: OpenTaal (opentaal.org), CC BY 3.0.", backHome: "← Slimspel", flag: "" },
  tr: { levels: { makkelijk: "Kolay · 4 harf", normaal: "Orta · 5 harf", moeilijk: "Zor · 6 harf" },
    intro: "Gizli kelimeyi 6 denemede bul. Gerçek bir kelime yaz ve Enter'a bas. Renkler sana yol gösterir:",
    legend: ["harf doğru, yeri doğru", "harf kelimede var, yeri farklı", "harf kelimede yok"],
    daily: "Her gün her seviye için bir yeni kelime var, herkes için aynı.", level: "Seviye",
    start: "Başla", cont: "Devam et", back: "← Geri", other: "Bugünün başka bir seviyesi",
    typeN: n => `${n} harf yaz.`, unknown: "Bu kelime sözlükte yok. Başka bir kelime dene.",
    todayWon: g => `Bugün ${g}. denemede bildin. Yarın yeni kelime var!`, todayLost: "Bugün bilemedin. Yarın yeni kelime var!",
    win: g => g === 1 ? "İlk denemede!" : g <= 3 ? "Harika!" : "Bildin!", lost: "Olmadı…",
    resWon: (lv, g, t) => `${lv} · ${g}. deneme · süre ${t}`, resLost: lv => `${lv} · yarın yeni bir şans!`,
    rec: p => p === null ? "İlk kez bildin!" : `Yeni rekor! (önceki: ${p} deneme)`, was: "Kelime:",
    stats: "İstatistiklerin", played: "oynanan", winPct: "% bilinen", streak: "seri", maxStreak: "en uzun seri",
    dist: "Kaçıncı denemede bildin", noStats: "Bu seviyede henüz oynamadın.",
    rank: "Sıralama", tabs: { dag: "Bugün", week: "Bu hafta", maand: "Bu ay" }, allLv: "Tüm seviyeler",
    cols: ["", "İsim", "Puan", "Gün", "Ort."], colDay: ["", "İsim", "Deneme", "Süre"], notGuessed: "bilemedi",
    nobody: "Bu dönemde henüz kimse yok.", pts: "Puan: 1. deneme 6, 2. deneme 5 … 6. deneme 1, bilemeyen 0.",
    rankErr: "Sıralama şu an yüklenemiyor.", saveErr: c => `Sonuç kaydedilemedi (${c}).`, loadErr: "Kelimeler yüklenemedi. Sayfayı yenile.",
    credit: "Kelime listesi: TDK Güncel Türkçe Sözlük başlıkları (github.com/bilalozdemir/tr-word-list, CC BY-SA 4.0); sıklık: FrequencyWords (MIT).",
    backHome: "← NL Oefenbank", flag: "· Türkçe" }
}[LANG];
const KEYS = LANG === "tr" ? ["ertyuıopğü", "asdfghjklşi", "zcvbnmöç"] : ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
// Turkish has no q, w and x
const LETTER = LANG === "tr" ? /^[abcçdefgğhıijklmnoöprsştuüvyz]$/ : /^[a-z]$/;
const lower = s => LANG === "tr" ? s.toLocaleLowerCase("tr") : s.toLowerCase();
const $ = id => document.getElementById(id);
document.documentElement.lang = LANG; // so CSS capitals are right in Turkish (i -> İ, ı -> I)
if (LANG === "tr") { $("back").href = "../../nl-oefenbank/"; document.title = "Woordle (Türkçe)"; }

const { user, profile } = await gate({ seen: MODULE });
$("user").innerHTML = userBox(user, profile);
const levels = profile.type === "child" ? ["makkelijk", "normaal"] : Object.keys(LEN);

// ---------- Words ----------
const valid = {};     // length -> Set of allowed guesses
let answers = {};     // length -> sorted list of possible answers
let info = {};        // NL: word -> entry from the nl-oefenbank pool; TR: word -> TDK meanings
let kwClue = {}, wzTheme = {}; // NL: where the word is used in other games
async function loadWords() {
  const txt = f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.text(); }).then(t => t.split("\n").map(x => x.trim()).filter(Boolean));
  if (LANG === "tr") {
    // Answers: hand-picked everyday Turkish words; guesses: all TDK headwords of that length
    for (const n of [4, 5, 6]) { answers[n] = (await txt(`tr-cevap-${n}.txt`)).sort(); valid[n] = new Set(await txt(`tr-geldig-${n}.txt`)); }
    info = await fetch("tr-anlam.json").then(r => r.json());
    return;
  }
  // NL answers only from our own lists: the nl-oefenbank pool (groep 1-6, read live) and the kruiswoord and
  // woordzoeker lists. Guesses: the OpenTaal list, so random letters like "aaaaa" are refused.
  const [pool, kw, wz] = await Promise.all([
    fetch("../../nl-oefenbank/data/woorden.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("pool"); return r.json(); }),
    fetch("../kruiswoord/woorden.json").then(r => r.json()),
    fetch("../woordzoeker/woorden.json").then(r => r.json())
  ]);
  const clean = t => t.trim().toLowerCase().replace(/^(de|het|een)\s+/, "");
  const cand = new Set();
  info.__turen = pool.turen || {}; info.__themas = pool.themas || {};
  for (const w of pool.woorden) {
    if (!["1-2", "3", "4", "5", "6"].includes(String(w.groep)) || (w.soort && w.soort !== "woord")) continue;
    const t = clean(w.nl);
    cand.add(t);
    if (!info[t]) info[t] = w;
  }
  kw.words.forEach(x => { const t = x.w.toLowerCase(); cand.add(t); kwClue[t] = x.c; });
  wz.themes.forEach(th => th.words.forEach(x => { const t = x.toLowerCase(); cand.add(t); wzTheme[t] = th.title; }));
  for (const n of [4, 5, 6]) {
    valid[n] = new Set(await txt(`geldig-${n}.txt`));
    // plain letters, no IJ, and a real word in OpenTaal (so no names like "japan")
    answers[n] = [...cand].filter(t => t.length === n && /^[a-z]+$/.test(t) && !t.includes("ij") && valid[n].has(t)).sort();
  }
}
try { await loadWords(); }
catch { document.querySelector("main").innerHTML = `<div class="panel"><p>${T.loadErr}</p></div>`; throw new Error("words"); }

// Today's word for a level: every candidate gets a number from (day, level, word); the smallest wins.
// Everybody gets the same word, and a word added to the list later rarely changes today's word.
// (The Dutch seed text stays "woordle" so the Dutch words of earlier days do not change.)
function hash(text) { let h = 2166136261; for (const ch of text) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const seedName = LANG === "tr" ? "woordle-tr" : "woordle";
const wordOf = (day, lv) => {
  let best = null, bestH = Infinity;
  for (const w of answers[LEN[lv]]) { const h = hash(`${day}|${seedName}|${lv}|${w}`); if (h < bestH) { bestH = h; best = w; } }
  return best;
};

let history = [];
try { history = await loadAttempts(user.uid, MODULE); } catch {}
let level = loadLocal(`woordle:${LANG}:level`, "makkelijk");
if (!levels.includes(level)) level = "makkelijk";
let S = null;
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const playedToday = lv => history.find(h => h.test === lv && h.day === today());
const progressKey = (day, lv) => `woordle:${LANG}:progress:${day}:${lv}`;
try {
  Object.keys(localStorage).filter(k => k.startsWith(`slimspel:woordle:`) && k.includes(":progress:") && !k.includes(today()))
    .forEach(k => localStorage.removeItem(k));
} catch {}

// ---------- Fixed texts ----------
$("flag").textContent = T.flag;
$("intro").textContent = T.intro;
$("legend").innerHTML = ["--good-c", "--near-c", "--miss-c"].map((c, i) => `<span><b style="background:var(${c})"></b>${T.legend[i]}</span>`).join("");
$("daily").textContent = T.daily;
$("lvlLabel").textContent = T.level;
$("stop").textContent = T.back;
$("change").textContent = T.other;
$("credit").textContent = T.credit;
if (LANG === "tr") $("back").textContent = T.backHome;

// ---------- Screen 1 ----------
function drawSetup() {
  $("levels").innerHTML = levels.map(l => `<button class="chip${l === level ? " on" : ""}" data-v="${l}">${T.levels[l]}${playedToday(l) ? " ✓" : ""}</button>`).join("");
  $("levels").querySelectorAll("button").forEach(b => b.onclick = () => { level = b.dataset.v; saveLocal(`woordle:${LANG}:level`, level); drawSetup(); });
  const done = playedToday(level);
  $("today").hidden = !done;
  if (done) $("today").textContent = done.score ? T.todayWon(done.guesses) : T.todayLost;
  $("go").disabled = !!done;
  $("go").textContent = loadLocal(progressKey(today(), level), null) ? T.cont : T.start;
  drawStats("statsBox1");
  drawRanking("rankBox1");
}
$("go").onclick = () => start();

// ---------- Own statistics (from his saved rounds) ----------
const dayNr = d => Math.floor(Date.parse(d + "T00:00:00Z") / 86400000); // day number since 1970 (UTC days)
function statsFor(lv) {
  const rounds = history.filter(h => h.test === lv && h.day);
  const byDay = new Map(rounds.map(h => [h.day, h]));        // one round per day per level
  const days = [...byDay.keys()].sort();
  const wins = days.filter(d => byDay.get(d).score);
  // current streak = days in a row with a guessed word, counting back from today
  // (or from yesterday when today's word is not played yet); a not-guessed day ends it
  const iso = n => new Date(n * 86400000).toISOString().slice(0, 10);
  let d = byDay.has(today()) ? dayNr(today()) : dayNr(today()) - 1, cur = 0;
  while (byDay.get(iso(d))?.score) { cur++; d--; }
  // longest streak ever
  let max = 0, run = 0, prev = null;
  for (const day of days) {
    const won = !!byDay.get(day).score;
    run = won ? (prev !== null && dayNr(day) === prev + 1 && run > 0 ? run + 1 : 1) : 0;
    max = Math.max(max, run); prev = dayNr(day);
  }
  const dist = [1, 2, 3, 4, 5, 6].map(g => wins.filter(d => byDay.get(d).guesses === g).length);
  return { played: days.length, wins: wins.length, cur, max, dist };
}
function drawStats(boxId, lastGuesses = 0) {
  const s = statsFor(level);
  const top = Math.max(1, ...s.dist);
  $(boxId).innerHTML = `<h3>${T.stats} · ${esc(T.levels[level])}</h3>` + (s.played ? `
    <div class="stats">
      <div><b>${s.played}</b><span>${T.played}</span></div>
      <div><b>${Math.round(100 * s.wins / s.played)}</b><span>${T.winPct}</span></div>
      <div><b>${s.cur}</b><span>${T.streak}</span></div>
      <div><b>${s.max}</b><span>${T.maxStreak}</span></div>
    </div>
    <div class="small" style="margin-top:12px">${T.dist}</div>
    <div class="dist">${s.dist.map((c, i) => `<div class="d"><span>${i + 1}</span><i class="${lastGuesses === i + 1 ? "now" : ""}" style="width:${Math.max(8, 100 * c / top)}%">${c}</i></div>`).join("")}</div>`
    : `<p class="small">${T.noStats}</p>`);
}

// ---------- Rankings (everyone's results from woordle_plays) ----------
let rankTab = "dag", rankLevel = "alle", plays = null;
function weekStart(day) { const n = dayNr(day), dow = (new Date(n * 86400000).getUTCDay() + 6) % 7; return new Date((n - dow) * 86400000).toISOString().slice(0, 10); }
async function loadPlays(force = false) {
  if (plays && !force) return plays;
  const day = today(), from = [weekStart(day), day.slice(0, 8) + "01"].sort()[0];
  plays = (await loadWoordlePlays(from)).filter(p => p.lang === LANG);
  return plays;
}
const points = p => p.won ? 7 - p.guesses : 0;
async function drawRanking(boxId) {
  const box = $(boxId);
  const tabs = Object.entries(T.tabs).map(([k, t]) => `<button class="chip${k === rankTab ? " on" : ""}" data-tab="${k}">${t}</button>`).join("");
  const lvs = [["alle", T.allLv], ...Object.keys(LEN).map(l => [l, T.levels[l].split(" · ")[1] || T.levels[l]])]
    .map(([k, t]) => `<button class="chip${k === rankLevel ? " on" : ""}" data-lv="${k}">${t}</button>`).join("");
  box.innerHTML = `<h3>${T.rank}</h3><div class="tabs">${tabs}</div><div class="tabs">${lvs}</div><div id="${boxId}-t"><p class="small">…</p></div>`;
  box.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { rankTab = b.dataset.tab; drawRanking(boxId); });
  box.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { rankLevel = b.dataset.lv; drawRanking(boxId); });
  let list;
  try { list = await loadPlays(); } catch { $(`${boxId}-t`).innerHTML = `<p class="small">${T.rankErr}</p>`; return; }
  const day = today(), from = rankTab === "dag" ? day : rankTab === "week" ? weekStart(day) : day.slice(0, 8) + "01";
  const sel = list.filter(p => p.day >= from && (rankLevel === "alle" || p.level === rankLevel));
  const medal = ["🥇", "🥈", "🥉"];
  if (!sel.length) { $(`${boxId}-t`).innerHTML = `<p class="small">${T.nobody}</p><p class="small">${T.pts}</p>`; return; }
  let html;
  if (rankTab === "dag" && rankLevel !== "alle") {
    // One word: guessed first, then fewer guesses, then faster
    sel.sort((a, b) => b.won - a.won || a.guesses - b.guesses || a.time_s - b.time_s);
    html = `<table class="rank"><tr>${T.colDay.map((c, i) => `<th class="${i > 1 ? "n" : ""}">${c}</th>`).join("")}</tr>` +
      sel.map((p, i) => `<tr class="${p.uid === user.uid ? "me" : ""}"><td>${medal[i] || i + 1}</td><td>${esc(p.name)}</td>
        <td class="n">${p.won ? p.guesses : T.notGuessed}</td><td class="n">${fmt(p.time_s)}</td></tr>`).join("") + `</table>`;
  } else {
    // Several words: sum of points; also days played and average guesses (guessed words only)
    const per = new Map();
    for (const p of sel) {
      const r = per.get(p.uid) || { name: p.name, uid: p.uid, pts: 0, days: new Set(), g: 0, w: 0 };
      r.pts += points(p); r.days.add(p.day); if (p.won) { r.g += p.guesses; r.w++; }
      per.set(p.uid, r);
    }
    const rows = [...per.values()].sort((a, b) => b.pts - a.pts || (a.w ? a.g / a.w : 9) - (b.w ? b.g / b.w : 9));
    html = `<table class="rank"><tr>${T.cols.map((c, i) => `<th class="${i > 1 ? "n" : ""}">${c}</th>`).join("")}</tr>` +
      rows.map((r, i) => `<tr class="${r.uid === user.uid ? "me" : ""}"><td>${medal[i] || i + 1}</td><td>${esc(r.name)}</td>
        <td class="n">${r.pts}</td><td class="n">${r.days.size}</td><td class="n">${r.w ? (r.g / r.w).toFixed(1) : "-"}</td></tr>`).join("") + `</table>`;
  }
  $(`${boxId}-t`).innerHTML = html + `<p class="small">${T.pts}</p>`;
}

// ---------- Screen 2 ----------
function show(s) { ["setup", "play", "done"].forEach(x => $(x).hidden = x !== s); }

function start() {
  const day = today();
  if (playedToday(level)) return drawSetup();
  const n = LEN[level];
  const saved = loadLocal(progressKey(day, level), null);
  S = { day, level, n, answer: wordOf(day, level), guesses: saved?.guesses || [], typed: "", done: false,
        elapsed: saved?.elapsed || 0, resumedAt: Date.now() };
  S.timer = setInterval(tick, 500); tick();
  $("what").textContent = T.levels[level];
  $("rows").innerHTML = [...Array(TRIES)].map(() => `<div class="rw" style="--n:${n}">${'<div class="lt"></div>'.repeat(n)}</div>`).join("");
  drawKeyboard();
  $("msg").textContent = "";
  show("play");
  draw();
}
const played = () => S.elapsed + Math.floor((Date.now() - S.resumedAt) / 1000);
function tick() { $("clock").textContent = fmt(played()); }
function saveProgress() { if (S && !S.done) saveLocal(progressKey(S.day, S.level), { guesses: S.guesses, elapsed: played() }); }
addEventListener("pagehide", saveProgress);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveProgress(); });

// Colours for one guess. Like the real game: first the green letters, then yellow only as often
// as the letter is still "left over" in the answer (so a double letter is not yellow twice for one letter).
function score(guess, answer) {
  const g = [...guess], a = [...answer], res = Array(g.length).fill("miss"), left = {};
  for (let i = 0; i < g.length; i++) {
    if (g[i] === a[i]) res[i] = "good";
    else left[a[i]] = (left[a[i]] || 0) + 1;
  }
  for (let i = 0; i < g.length; i++) {
    if (res[i] !== "good" && left[g[i]] > 0) { res[i] = "near"; left[g[i]]--; }
  }
  return res;
}

function draw(flipRow = -1) {
  const rows = $("rows").children;
  S.guesses.forEach((g, r) => {
    const sc = score(g, S.answer), ch = [...g];
    [...rows[r].children].forEach((el, i) => {
      el.textContent = ch[i];
      el.className = "lt " + sc[i] + (r === flipRow ? " flip" : "");
      if (r === flipRow) el.style.animationDelay = `${i * 90}ms`;
    });
  });
  const r = S.guesses.length, typed = [...S.typed];
  if (r < TRIES) [...rows[r].children].forEach((el, i) => { el.textContent = typed[i] || ""; el.className = "lt" + (typed[i] ? " filled" : ""); });
  // Keyboard colours: the best colour a letter got so far
  const rank = { good: 3, near: 2, miss: 1 }, best = {};
  S.guesses.forEach(g => { const ch = [...g]; score(g, S.answer).forEach((c, i) => { if ((rank[c] || 0) > (rank[best[ch[i]]] || 0)) best[ch[i]] = c; }); });
  $("kb").querySelectorAll("[data-k]").forEach(k => { const c = best[k.dataset.k]; k.className = "key" + (k.dataset.k.length > 1 ? " wide" : "") + (c ? " " + c : ""); });
}

function drawKeyboard() {
  $("kb").innerHTML = KEYS.map((r, i) => `<div class="r">${i === 2 ? `<button class="key wide" data-k="enter">Enter</button>` : ""}${[...r].map(ch => `<button class="key" data-k="${ch}">${ch}</button>`).join("")}${i === 2 ? `<button class="key wide" data-k="back" aria-label="wissen">⌫</button>` : ""}</div>`).join("");
  $("kb").querySelectorAll("[data-k]").forEach(k => k.onclick = () => press(k.dataset.k));
}

function press(k) {
  if (!S || S.done) return;
  $("msg").textContent = "";
  if (k === "back") S.typed = [...S.typed].slice(0, -1).join("");
  else if (k === "enter") return submit();
  else if (LETTER.test(k) && [...S.typed].length < S.n) S.typed += k;
  draw();
}
document.addEventListener("keydown", e => {
  if (!S || $("play").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Enter") { e.preventDefault(); press("enter"); }
  else if (e.key === "Backspace") { e.preventDefault(); press("back"); }
  else if (e.key.length === 1 && LETTER.test(lower(e.key))) press(lower(e.key));
});

function submit() {
  const row = $("rows").children[S.guesses.length];
  if ([...S.typed].length < S.n) { $("msg").textContent = T.typeN(S.n); flash(row, "shake"); return; }
  // Not a real word: refused, and it does not cost a turn
  if (!valid[S.n].has(S.typed) && !answers[S.n].includes(S.typed)) { $("msg").textContent = T.unknown; flash(row, "shake"); return; }
  S.guesses.push(S.typed);
  S.typed = "";
  draw(S.guesses.length - 1);
  saveProgress();
  const won = S.guesses.at(-1) === S.answer;
  if (won || S.guesses.length === TRIES) setTimeout(() => finish(won), S.n * 90 + 450);
}
$("stop").onclick = () => { saveProgress(); clearInterval(S.timer); show("setup"); drawSetup(); };
$("change").onclick = () => { show("setup"); drawSetup(); };

// ---------- Screen 3 ----------
function finish(won) {
  S.done = true;
  clearInterval(S.timer);
  const time_s = played(), g = S.guesses.length;
  const wonBefore = history.filter(h => h.test === S.level && h.score).map(h => h.guesses);
  const prev = wonBefore.length ? Math.min(...wonBefore) : null;
  saveLocal(progressKey(S.day, S.level), null);
  // His own round (score 1/1 = guessed); the answer goes into `answers`, so the admin sees which words were hard
  const attempt = { test: S.level, day: S.day, lang: LANG, score: won ? 1 : 0, total: 1, guesses: g, time_s, word: S.answer,
                    answers: [{ qid: S.answer, chosen: S.guesses.join(","), correct: won }], finished_at: new Date().toISOString() };
  history.unshift({ ...attempt, module: MODULE });
  const saveErr = e => { if (!document.querySelector("#done .saveerr")) $("resultText").insertAdjacentHTML("afterend", `<p class="saveerr">${T.saveErr(e.code || "fout")}</p>`); };
  document.querySelector("#done .saveerr")?.remove();
  saveAttempt(user.uid, MODULE, attempt).catch(saveErr);
  // Everyone's results for the rankings (guessed or not)
  const posted = saveWoordlePlay(user, profile, { lang: LANG, level: S.level, day: S.day, won, guesses: g, time_s }).catch(() => {});

  show("done");
  $("result").textContent = won ? T.win(g) : T.lost;
  $("resultText").textContent = won ? T.resWon(T.levels[S.level], g, fmt(time_s)) : T.resLost(T.levels[S.level]);
  $("record").hidden = !won || (prev !== null && g >= prev);
  $("record").textContent = T.rec(prev);
  wordInfo(S.answer);
  drawStats("statsBox2", won ? g : 0);
  posted.then(() => { plays = null; drawRanking("rankBox2"); });
}

// What the word means and where it is used. Only facts from our own data (and a link for the origin).
async function wordInfo(w) {
  const box = $("wordInfo");
  let html = `<div>${T.was}</div><div class="w">${esc(w)}</div>`;
  if (LANG === "tr") {
    const m = info[w] || [];
    if (m.length) html += `<h4>Anlamı (TDK)</h4>` + m.map((x, i) => `<p>${m.length > 1 ? `${i + 1}. ` : ""}${esc(x)}</p>`).join("");
    html += `<p class="small"><a href="https://tr.wiktionary.org/wiki/${encodeURIComponent(w)}" target="_blank" rel="noopener">Vikisözlük'te kökeni ve diğer anlamları →</a></p>`;
    box.innerHTML = html;
    return;
  }
  const e = info[w];
  if (e) {
    const tags = [e.nl.match(/^(de|het)\s/)?.[1], (info.__turen[e.tur] || "").split(" · ")[0], e.niveau, e.groep ? "groep " + e.groep : "", (info.__themas[e.thema] || "").split(" · ")[0]].filter(Boolean);
    html += `<div class="row2">${tags.map(t => `<span class="tag2">${esc(t)}</span>`).join("")}</div>`;
    if (e.tr) html += `<p>Türkçe: <b>${esc(e.tr)}</b></p>`;
    if (e.uitleg) html += `<p>${esc(e.uitleg)}</p>`;
    if (e.voorbeeld) html += `<h4>Voorbeeld</h4><p class="ex">${esc(e.voorbeeld)}</p>${e.voorbeeld_tr ? `<p class="small">${esc(e.voorbeeld_tr)}</p>` : ""}`;
  }
  const where = [];
  if (kwClue[w]) where.push(`Kruiswoord: “${esc(kwClue[w])}”`);
  if (wzTheme[w]) where.push(`Woordzoeker: thema ${esc(wzTheme[w])}`);
  if (where.length) html += `<h4>Ook in Slimspel</h4>` + where.map(x => `<p>${x}</p>`).join("");
  html += `<div id="nieuwsHits"></div>`;
  html += `<p class="small"><a href="https://nl.wiktionary.org/wiki/${encodeURIComponent(w)}" target="_blank" rel="noopener">Herkomst en meer betekenissen (WikiWoordenboek) →</a></p>`;
  box.innerHTML = html;
  // Sentences with this word in the "Nieuws in niveaus" texts of nl-oefenbank (easiest level first)
  try {
    const nieuws = await fetch("../../nl-oefenbank/data/nieuws.json").then(r => r.json());
    const re = new RegExp(`(^|[^a-zà-ÿ])${w}([^a-zà-ÿ]|$)`, "i"), hits = [];
    for (const item of nieuws.items || []) for (const lv of ["a0", "a1", "a2", "b1", "b2", "c1"]) {
      if (hits.length >= 3 || hits.some(h => h.id === item.id)) break;
      const text = String(item[lv] || "").replace(/<[^>]+>/g, "");
      const sent = text.split(/(?<=[.!?])\s+|\n+/).find(s => re.test(s));
      if (sent) hits.push({ id: item.id, title: item.titel, lv: lv.toUpperCase(), s: sent.trim() });
    }
    if (hits.length) $("nieuwsHits").innerHTML = `<h4>In Nieuws in niveaus</h4>` + hits.map(h => `<p class="ex">${esc(h.s)}</p><p class="small">${esc(h.title)} · ${h.lv}</p>`).join("");
  } catch {}
}

// Local tests only (never on the real site)
if (location.hostname === "localhost") window.__woordle = () => S && { answer: S.answer, n: S.n };

drawSetup();
</script>
