<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kriskras · Slimspel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../css/site.css">
<style>
/* Page-specific styles for kriskras (same grid look as the kruiswoord) */
.label{font-family:var(--f-display);font-weight:600;margin-top:22px;margin-bottom:8px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice .chip{font-size:17px;padding:8px 16px}
.records{margin-top:18px;color:var(--muted);font-size:15px}
.today{margin-top:14px;font-family:var(--f-display);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:18px;align-items:start}
@media (max-width:700px){.game{grid-template-columns:1fr}}

.cw{--w:7;display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));gap:3px;width:min(100%,calc(var(--w) * 52px));margin:0 auto}
.sq{position:relative;aspect-ratio:1;border-radius:6px}
.sq.on{background:var(--card);border:2px solid var(--ink);cursor:pointer;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:clamp(16px,4vw,26px);color:#2f5bd3}
.sq.word{background:color-mix(in srgb,var(--accent) 30%,var(--card))}
.sq.sel{background:var(--accent);color:var(--accent-ink)}
.sq.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.sq.given{color:var(--ink)}
.sq.hint{color:var(--muted);font-style:italic}
@keyframes good{0%,60%{background:var(--good);color:#fff}100%{}}
.sq.flashgood{animation:good 1s ease-out}
@media (prefers-reduced-motion: reduce){.sq.flashgood{animation:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sq.on{color:#8fb0ff}}

/* The list of words to place, grouped by length */
.words h3{font-size:16px;margin:10px 0 6px;color:var(--muted)}
.words h3:first-child{margin-top:0}
.words ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.words li{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-family:var(--f-display);font-weight:600;letter-spacing:.05em}
.words li.done{text-decoration:line-through;color:var(--muted);background:var(--good-bg);border-color:var(--good-bg)}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
#kbd{position:fixed;left:-200px;top:0;width:40px;height:20px;opacity:0}

.big{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,10vw,60px);line-height:1.1}
.record{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;border-radius:99px;padding:3px 12px;margin-top:8px}
</style>
</head>
<body>
<!-- Covers the page until js/core.js has checked the login (see index.html of the site) -->
<div id="gate"><div class="gc"><p>Laden…</p></div></div>
<script>
setTimeout(() => {
  if (window.__slimReady) return;
  document.querySelector("#gate .gc").innerHTML =
    "<h2>Laden lukt niet</h2><p>Ververs de pagina. Gaat het nog steeds mis? Vraag het aan Zana.</p>";
}, 10000);
</script>
<main class="wrap">
  <div class="top">
    <a class="back" href="../">← Slimspel</a>
    <span id="user"></span>
  </div>

  <!-- Screen 1: level -->
  <section id="setup">
    <h1><mark>Kris</mark>kras</h1>
    <p class="sub">Zet alle woorden uit de lijst op de goede plek in het rooster. Tel de letters en kijk welke letters elkaar kruisen.<br>Elke dag is er per niveau één nieuwe puzzel, voor iedereen dezelfde.</p>
    <div class="label">Niveau</div>
    <div class="choice" id="levels"></div>
    <p class="sub" id="levelInfo"></p>
    <p class="today" id="today" hidden></p>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="go">Start</button></div>
    <p class="records" id="records"></p>
    <div class="board-box"><h3>Vandaag</h3><div id="board1"></div></div>
  </section>

  <!-- Screen 2: the puzzle -->
  <section id="play" hidden>
    <div class="bar">
      <span class="chip" id="what"></span>
      <span class="chip" id="count"></span>
      <span class="chip" id="clock">0:00</span>
    </div>
    <div class="game">
      <div><div class="cw" id="cw"></div></div>
      <div>
        <div class="words" id="words"></div>
        <div class="tools">
          <button class="btn" id="hint">Hint</button>
          <button class="btn" id="stop">← Terug</button>
        </div>
      </div>
    </div>
    <input id="kbd" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="letter typen">
  </section>

  <!-- Screen 3: solved -->
  <section id="done" hidden>
    <div class="panel">
      <div class="big">Alles past!</div>
      <p class="sub" id="resultText"></p>
      <span class="record" id="record" hidden></span>
      <div class="board-box"><h3>Vandaag</h3><div id="board2"></div></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="change">Ander niveau van vandaag</button>
    </div>
  </section>
</main>

<script type="module">
import { gate, userBox, saveAttempt, loadAttempts, flash, loadLocal, saveLocal, postScore, loadBoard, boardHtml, today } from "../js/core.js";
// Same generator and word bank as the kruiswoord, with its own daily seed
import { makePuzzle, seededRandom } from "../kruiswoord/engine.js";

const MODULE = "slimspel-kriskras";
const LEVELS = { makkelijk: "Makkelijk", normaal: "Normaal", moeilijk: "Moeilijk" };
const LEVEL_INFO = {
  makkelijk: "5 korte woorden. Twee letters staan er al.",
  normaal: "7 woorden. Eén letter staat er al.",
  moeilijk: "9 woorden, ook langere. Eén letter staat er al."
};
const GIVEN = { makkelijk: 2, normaal: 1, moeilijk: 1 }; // how many words start with their first letter filled in
const $ = id => document.getElementById(id);

const { user, profile } = await gate({ seen: MODULE });
$("user").innerHTML = userBox(user, profile);

const levels = profile.type === "child" ? ["makkelijk", "normaal"] : Object.keys(LEVELS);
const bank = await fetch("../kruiswoord/woorden.json", { cache: "no-cache" }).then(r => r.json());
let history = [];
try { history = await loadAttempts(user.uid, MODULE); } catch {}

let level = loadLocal("kriskras:level", "makkelijk");
if (!levels.includes(level)) level = "makkelijk";
let S = null;

const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const solvedToday = lv => history.find(h => h.test === lv && h.day === today());
const progressKey = (day, lv) => `kriskras:progress:${day}:${lv}`;
try {
  Object.keys(localStorage).filter(k => k.startsWith("slimspel:kriskras:progress:") && !k.includes(today()))
    .forEach(k => localStorage.removeItem(k));
} catch {}

// ---------- Screen 1 ----------
function drawSetup() {
  $("levels").innerHTML = levels.map(l =>
    `<button class="chip${l === level ? " on" : ""}" data-v="${l}">${LEVELS[l]}${solvedToday(l) ? " ✓" : ""}</button>`).join("");
  $("levels").querySelectorAll("button").forEach(b => b.onclick = () => { level = b.dataset.v; saveLocal("kriskras:level", level); drawSetup(); });
  $("levelInfo").textContent = LEVEL_INFO[level];
  const done = solvedToday(level);
  $("today").hidden = !done;
  if (done) $("today").textContent = `Vandaag opgelost in ${fmt(done.time_s)}${done.hints ? ` met ${done.hints} hint${done.hints > 1 ? "s" : ""}` : ""}. Morgen is er een nieuwe puzzel!`;
  $("go").disabled = !!done;
  $("go").textContent = loadLocal(progressKey(today(), level), null) ? "Verder spelen" : "Start";
  const t = history.filter(h => h.test === level && !h.hints).map(h => h.time_s);
  $("records").textContent = t.length ? `Jouw record (zonder hints): ${fmt(Math.min(...t))}` : "Nog geen record voor dit niveau.";
  drawBoard("board1", level);
}
async function drawBoard(elId, lv) {
  const el = $(elId);
  el.innerHTML = `<p class="board-empty">Laden…</p>`;
  try { el.innerHTML = boardHtml(await loadBoard(today(), "kriskras-" + lv), user.uid); }
  catch { el.innerHTML = `<p class="board-empty">De ranglijst is nu niet beschikbaar.</p>`; }
}
$("go").onclick = () => start();

// ---------- Screen 2 ----------
function show(s) { ["setup", "play", "done"].forEach(x => $(x).hidden = x !== s); }

function start() {
  const day = today();
  if (solvedToday(level)) return drawSetup();
  const P = makePuzzle(level, bank, seededRandom(`${day}|kriskras|${level}`));
  // Letters that are given at the start: the first letter of the first few words
  const given = new Set(P.words.slice(0, GIVEN[level]).map(x => x.cells[0]));
  const saved = loadLocal(progressKey(day, level), null);
  S = { day, level, P, given, done: false,
        grid: saved?.grid?.length === P.solution.length ? saved.grid : P.solution.map((ch, i) => given.has(i) ? ch : ""),
        hinted: new Set(saved?.hinted || []), hintsUsed: saved?.hintsUsed || 0,
        elapsed: saved?.elapsed || 0, resumedAt: Date.now(), word: 0, cell: 0 };
  // the words to place, as a list (a word can be in it twice only if the bank had it twice, which it does not)
  S.list = P.words.map(x => x.w).sort((a, b) => a.length - b.length || a.localeCompare(b));
  S.word = 0; S.cell = firstOpen(0);
  S.okSlots = okSlots();
  S.timer = setInterval(tick, 500); tick();
  $("what").textContent = LEVELS[level];
  $("cw").style.setProperty("--w", P.w);
  $("cw").innerHTML = P.solution.map((ch, i) => ch ? `<div class="sq on" data-i="${i}"><span class="l"></span></div>` : `<div class="sq"></div>`).join("");
  $("cw").querySelectorAll(".sq.on").forEach(el => el.onclick = () => pickCell(Number(el.dataset.i)));
  show("play");
  draw();
  focusKbd();
}

const played = () => S.elapsed + Math.floor((Date.now() - S.resumedAt) / 1000);
function tick() { $("clock").textContent = fmt(played()); }
function saveProgress() {
  if (!S || S.done) return;
  saveLocal(progressKey(S.day, S.level), { grid: S.grid, hinted: [...S.hinted], hintsUsed: S.hintsUsed, elapsed: played() });
}
addEventListener("pagehide", saveProgress);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveProgress(); });

const locked = i => S.given.has(i) || S.hinted.has(i);
const wordsAt = i => S.P.words.map((w, k) => k).filter(k => S.P.words[k].cells.includes(i));
const slotText = k => S.P.words[k].cells.map(i => S.grid[i] || "").join("");
function firstOpen(k) { const cells = S.P.words[k].cells; return cells.find(i => !S.grid?.[i]) ?? cells[0]; }

// A slot is right when it holds a word from the list. Each list word may be used once
// (other ways to place the words than our own solution also count, as long as everything fits).
function okSlots() {
  const left = [...S.list], ok = new Set();
  S.P.words.forEach((x, k) => {
    const t = slotText(k);
    if (t.length !== x.w.length) return;
    const j = left.indexOf(t);
    if (j >= 0) { ok.add(k); left.splice(j, 1); }
  });
  return ok;
}

function pickCell(i) {
  const ws = wordsAt(i);
  if (i === S.cell && ws.length > 1) S.word = ws.find(k => k !== S.word) ?? ws[0];
  else if (!ws.includes(S.word)) S.word = ws[0];
  S.cell = i;
  draw();
  focusKbd();
}
function focusKbd() { $("kbd").focus({ preventScroll: true }); }

function draw() {
  const active = new Set(S.P.words[S.word].cells);
  const okCells = new Set([...S.okSlots].flatMap(k => S.P.words[k].cells));
  $("cw").querySelectorAll(".sq.on").forEach(el => {
    const i = Number(el.dataset.i);
    el.querySelector(".l").textContent = S.grid[i];
    el.classList.toggle("ok", okCells.has(i));
    el.classList.toggle("word", active.has(i) && !okCells.has(i));
    el.classList.toggle("sel", i === S.cell);
    el.classList.toggle("given", S.given.has(i));
    el.classList.toggle("hint", S.hinted.has(i));
  });
  // Cross off the words that are placed (each placed word crosses off one copy in the list)
  const placed = [...S.okSlots].map(slotText);
  const byLen = {};
  S.list.forEach(w => (byLen[w.length] ||= []).push(w));
  $("words").innerHTML = Object.entries(byLen).map(([n, ws]) => `<h3>${n} letters</h3><ul>${ws.map(w => {
    const j = placed.indexOf(w); if (j >= 0) placed.splice(j, 1);
    return `<li class="${j >= 0 ? "done" : ""}">${w}</li>`;
  }).join("")}</ul>`).join("");
  $("count").textContent = `${S.okSlots.size} / ${S.P.words.length} woorden`;
}

function type(ch) {
  if (!S || S.done) return;
  if (!locked(S.cell)) S.grid[S.cell] = ch;
  const cells = S.P.words[S.word].cells, pos = cells.indexOf(S.cell);
  if (pos < cells.length - 1) S.cell = cells[pos + 1];
  afterChange(pos === cells.length - 1); // jump to the next word only after the last letter
}
function backspace() {
  if (!S || S.done) return;
  const cells = S.P.words[S.word].cells, pos = cells.indexOf(S.cell);
  if ((!S.grid[S.cell] || locked(S.cell)) && pos > 0) S.cell = cells[pos - 1];
  if (!locked(S.cell)) S.grid[S.cell] = "";
  afterChange();
}
function afterChange(mayJump = false) {
  const before = S.okSlots;
  S.okSlots = okSlots();
  draw();
  for (const k of S.okSlots) if (!before.has(k)) {
    S.P.words[k].cells.forEach(i => flash($("cw").querySelector(`[data-i="${i}"]`), "flashgood"));
    const next = S.P.words.findIndex((w, j) => !S.okSlots.has(j));
    if (mayJump && k === S.word && next >= 0) { S.word = next; S.cell = firstOpen(next); draw(); }
  }
  saveProgress();
  if (S.okSlots.size === S.P.words.length) finish();
}
function move(dr, dc) {
  const { w, h, solution } = S.P;
  let r = Math.floor(S.cell / w) + dr, c = S.cell % w + dc;
  while (r >= 0 && c >= 0 && r < h && c < w) {
    const i = r * w + c;
    if (solution[i]) {
      const ws = wordsAt(i), want = dr ? "V" : "H";
      S.word = ws.find(k => S.P.words[k].dir === want) ?? ws[0];
      S.cell = i; draw(); return;
    }
    r += dr; c += dc;
  }
}

$("kbd").addEventListener("input", e => {
  const ch = e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(-1);
  e.target.value = "";
  if (ch) type(ch);
});
document.addEventListener("keydown", e => {
  if (!S || $("play").hidden || S.done) return;
  if (e.key === "Backspace") { e.preventDefault(); backspace(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); move(0, 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); move(0, -1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); move(1, 0); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1, 0); }
  else if (e.key === "Enter" || e.key === "Tab") {
    e.preventDefault();
    const n = S.P.words.length, next = [...Array(n).keys()].map(j => (S.word + 1 + j) % n).find(j => !S.okSlots.has(j));
    if (next !== undefined) { S.word = next; S.cell = firstOpen(next); draw(); }
  }
  else if (document.activeElement !== $("kbd") && /^[a-zA-Z]$/.test(e.key)) { type(e.key.toUpperCase()); focusKbd(); }
});

// Hint: one letter from our solution (the selected square if it is wrong or empty, else in the active word, else anywhere)
$("hint").onclick = () => {
  if (!S || S.done) return;
  const wrong = i => S.grid[i] !== S.P.solution[i];
  let i = wrong(S.cell) ? S.cell : S.P.words[S.word].cells.find(wrong);
  if (i === undefined) i = S.P.solution.findIndex((ch, j) => ch && wrong(j));
  if (i < 0) return;
  S.grid[i] = S.P.solution[i];
  S.hinted.add(i);
  S.hintsUsed++;
  S.cell = i;
  afterChange();
  focusKbd();
};
$("stop").onclick = () => { saveProgress(); clearInterval(S.timer); show("setup"); drawSetup(); };
$("change").onclick = () => { show("setup"); drawSetup(); };

// ---------- Screen 3 ----------
function finish() {
  S.done = true;
  clearInterval(S.timer);
  const time_s = played(), hints = S.hintsUsed, n = S.P.words.length;
  const earlier = history.filter(h => h.test === S.level && !h.hints).map(h => h.time_s);
  const prev = earlier.length ? Math.min(...earlier) : null;
  saveLocal(progressKey(S.day, S.level), null);
  const letters = S.P.solution.filter(Boolean).length - S.given.size;
  // score = letters he typed himself, total = letters he had to fill
  const attempt = { test: S.level, day: S.day, score: Math.max(0, letters - hints), total: letters, hints, time_s,
                    words: S.list, answers: [], finished_at: new Date().toISOString() };
  history.unshift({ ...attempt, module: MODULE });
  document.querySelector("#done .saveerr")?.remove();
  saveAttempt(user.uid, MODULE, attempt).catch(e =>
    $("resultText").insertAdjacentHTML("afterend", `<p class="saveerr">Score niet opgeslagen (${e.code || "fout"}).</p>`));
  const posted = postScore(user, profile, S.day, "kriskras-" + S.level, time_s, hints).catch(() => {});
  setTimeout(() => {
    show("done");
    $("resultText").textContent = `${LEVELS[S.level]} · ${n} woorden · tijd ${fmt(time_s)}` + (hints ? ` · ${hints} hint${hints > 1 ? "s" : ""}` : " · zonder hints");
    $("record").hidden = !!hints || (prev !== null && time_s >= prev);
    $("record").textContent = prev === null ? "Eerste record!" : `Nieuw record! (was ${fmt(prev)})`;
    posted.then(() => drawBoard("board2", S.level));
  }, 1100);
}

// Local tests only (never on the real site): which word and square are active
if (location.hostname === "localhost") window.__kk = () => S && { word: S.word, cell: S.cell, ok: [...S.okSlots] };

drawSetup();
</script>
</body>
</html>
